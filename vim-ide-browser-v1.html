<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>vim.js</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#1e1e1e;color:#d4d4d4;
    font:15px/1.5 'JetBrains Mono',Consolas,monospace;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh}
  #editor{flex:1;display:flex;overflow:hidden}
  #gutter{padding:12px 10px 12px 16px;background:#252526;color:#6e7681;
    text-align:right;user-select:none;overflow:hidden;min-width:52px;font-size:14px}
  #gutter .cur{color:#d4d4d4;font-weight:700}
  #wrap{flex:1;overflow:auto}
  #wrap::-webkit-scrollbar{width:10px;height:10px}
  #wrap::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:5px}
  #code{padding:12px 16px;white-space:pre;outline:none;min-height:100%}
  .line{height:1.5em;white-space:pre}
  .cur-char{background:#d4d4d4;color:#1e1e1e;border-radius:1px}
  .cur-char.ins{background:transparent;color:inherit;border-left:2px solid #4fc1ff;
    margin-left:-2px;margin-right:-1px}
  .sel{background:#264f78}
  #status{flex:0 0 auto;height:28px;padding:4px 12px;display:flex;
    justify-content:space-between;align-items:center;font-size:13px;
    color:#fff;background:#007acc;user-select:none}
  #status.insert{background:#16a34a}
  #status.visual,#status.vline{background:#d97706}
  #status.command{background:#7c3aed}
  #status .right{display:flex;gap:16px}
  #status .msg{color:#ffe066}
  #cmd{position:fixed;bottom:28px;left:0;right:0;background:#1e1e1e;
    border-top:1px solid #333;padding:6px 12px;display:none;z-index:10}
  #cmd.on{display:block}
  #cmd .p{color:#4fc1ff;font-weight:700}
  #cmd .caret{background:#d4d4d4;color:#1e1e1e}
  .welcome{color:#6e7681}
</style>
</head>
<body>
<div id="app">
  <div id="editor">
    <div id="gutter"></div>
    <div id="wrap"><div id="code"></div></div>
  </div>
  <div id="status">
    <div><b id="mode">NORMAL</b> <span id="file">untitled.txt</span></div>
    <div class="right"><span class="msg" id="msg"></span><span id="pos">1:1</span></div>
  </div>
  <div id="cmd"><span class="p">:</span><span id="cmdtext"></span><span class="caret">&nbsp;</span></div>
</div>

<script>
(function(){
'use strict';

// ---------- состояние ----------
let mode='normal', lines=[''], cy=0, cx=0;
let pendingCount='', pendingOp='', pendingG=false;
let reg='', regLine=false;
let undoS=[], redoS=[], anchor=null;
let cmdBuf='', filename='untitled.txt', msg='', msgT=null;
let dirty=false, help=false;

const MODES={normal:'NORMAL',insert:'INSERT',visual:'VISUAL',vline:'V-LINE',command:'COMMAND'};
const HELP=[
'  vim.js — мини-Vim в браузере',
'',
'  ДВИЖЕНИЕ   h j k l   w b e   0 ^ $   gg G',
'  ВСТАВКА    i a I A o O    Esc — выход',
'  ПРАВКА     x  dd  dw  yy  yw  p  P  u  r  J  ~',
'  ВИЗУАЛ     v (символы) / V (строки), затем d y c > <',
'  КОМАНДЫ    :w  :wq  :e file  :help  :N',
'',
'  Нажмите :help чтобы скрыть справку.',
''];
const $=id=>document.getElementById(id);
const gutter=$('gutter'), codeEl=$('code'), wrap=$('wrap');
const modeEl=$('mode'), fileEl=$('file'), msgEl=$('msg'), posEl=$('pos');
const statusEl=$('status'), cmdEl=$('cmd'), cmdTextEl=$('cmdtext');

// ---------- утилиты ----------
const isW=c=>c!==undefined&&/[A-Za-z0-9_]/.test(c);
const firstNB=l=>{const m=l.match(/\S/);return m?m.index:0;};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function setMsg(m){msg=m;if(msgT)clearTimeout(msgT);msgT=setTimeout(()=>{msg='';render();},3500);}
function clamp(){if(cy<0)cy=0;if(cy>=lines.length)cy=lines.length-1;
  const max=mode==='insert'?lines[cy].length:Math.max(0,lines[cy].length-1);
  if(cx>max)cx=max;if(cx<0)cx=0;}

// ---------- undo ----------
function save(){undoS.push({L:lines.slice(),y:cy,x:cx,m:mode});
  if(undoS.length>500)undoS.shift();redoS=[];dirty=true;}
function undo(){if(!undoS.length)return setMsg('уже в начале');
  redoS.push({L:lines.slice(),y:cy,x:cx,m:mode});
  const s=undoS.pop();lines=s.L;cy=s.y;cx=s.x;if(mode==='insert')mode='normal';clamp();}
function redo(){if(!redoS.length)return setMsg('нечего повторять');
  undoS.push({L:lines.slice(),y:cy,x:cx,m:mode});
  const s=redoS.pop();lines=s.L;cy=s.y;cx=s.x;if(mode==='insert')mode='normal';clamp();}

// ---------- рендер ----------
function renderLine(line,cc,ins,sel){
  let h='';
  for(let i=0;i<line.length;i++){
    const cls=[];
    if(i===cc&&!ins)cls.push('cur-char');
    if(sel&&i>=sel.s&&i<sel.e)cls.push('sel');
    h+=cls.length?'<span class="'+cls.join(' ')+'">'+esc(line[i])+'</span>':esc(line[i]);
  }
  if(cc===line.length&&cc>=0)
    h+='<span class="cur-char'+(ins?' ins':'')+'"> </span>';
  return h||' ';
}
function selection(){
  if(!anchor)return null;
  let al=anchor.l,ac=anchor.c,bl=cy,bc=cx;
  if(al>bl||(al===bl&&ac>bc)){[al,bl]=[bl,al];[ac,bc]=[bc,ac];}
  if(mode==='vline')return{type:'L',sl:al,el:bl};
  return{type:'C',sl:al,sc:ac,el:bl,ec:bc};
}
function render(){
  clamp();
  const sel=selection();
  let g='',h='';
  for(let i=0;i<lines.length;i++){
    g+='<div class="'+(i===cy?'cur':'')+'">'+(i+1)+'</div>';
    let ls=null;
    if(sel){
      if(sel.type==='L'){if(i>=sel.sl&&i<=sel.el)ls={s:0,e:Math.max(lines[i].length,1)};}
      else{
        if(i===sel.sl&&i===sel.el)ls={s:sel.sc,e:sel.ec+1};
        else if(i===sel.sl)ls={s:sel.sc,e:lines[i].length};
        else if(i===sel.el)ls={s:0,e:sel.ec+1};
        else if(i>sel.sl&&i<sel.el)ls={s:0,e:lines[i].length};
      }
    }
    const inner=help&&i<HELP.length
      ?'<span class="welcome">'+esc(HELP[i])+'</span>'
      :renderLine(lines[i],i===cy?cx:-1,mode==='insert',ls);
    h+='<div class="line" data-line="'+i+'">'+inner+'</div>';
  }
  gutter.innerHTML=g;
  codeEl.innerHTML=h;
  modeEl.textContent=MODES[mode];
  fileEl.textContent=filename+(dirty?' [+]':'');
  posEl.textContent=(cy+1)+':'+(cx+1);
  msgEl.textContent=msg;
  statusEl.className=mode;
  cmdEl.classList.toggle('on',mode==='command');
  cmdTextEl.textContent=cmdBuf;
  // скролл к курсору
  const c=codeEl.querySelector('.cur-char');
  if(c){
    const wr=wrap.getBoundingClientRect(),cr=c.getBoundingClientRect(),m=24;
    if(cr.top<wr.top+m)wrap.scrollTop-=(wr.top+m)-cr.top;
    else if(cr.bottom>wr.bottom-m)wrap.scrollTop+=cr.bottom-(wr.bottom-m);
    if(cr.left<wr.left)wrap.scrollLeft-=wr.left-cr.left+8;
    else if(cr.right>wr.right)wrap.scrollLeft+=cr.right-wr.right+8;
  }
}
wrap.addEventListener('scroll',()=>{gutter.style.transform='translateY('+(-wrap.scrollTop)+'px)';});

// ---------- движения ----------
function wFwd(){const L=lines[cy];let x=cx;
  if(x<L.length&&!isW(L[x])){while(x<L.length&&!isW(L[x]))x++;}
  else{while(x<L.length&&isW(L[x]))x++;while(x<L.length&&!isW(L[x]))x++;}
  if(x>=L.length){if(cy<lines.length-1){cy++;cx=firstNB(lines[cy]);}
    else cx=Math.max(0,L.length-1);}else cx=x;}
function wBack(){const L=lines[cy];let x=cx;
  if(x===0){if(cy>0){cy--;cx=Math.max(0,lines[cy].length-1);}return;}
  x--;while(x>0&&!isW(L[x]))x--;while(x>0&&isW(L[x-1]))x--;cx=x;}
function wEnd(){let L=lines[cy],x=cx;
  if(x>=L.length-1){if(cy<lines.length-1){cy++;L=lines[cy];x=0;
    while(x<L.length&&!isW(L[x]))x++;
    while(x<L.length-1&&isW(L[x+1]))x++;cx=x;}return;}
  x++;while(x<L.length&&!isW(L[x]))x++;
  while(x<L.length-1&&isW(L[x+1]))x++;
  cx=Math.min(x,Math.max(0,L.length-1));}
function motion(key,n){
  const sy=cy,sx=cx;
  if(key==='h')return{y:cy,x:Math.max(0,cx-n)};
  if(key==='l')return{y:cy,x:Math.min(Math.max(0,lines[cy].length-1),cx+n)};
  if(key==='j')return{y:Math.min(lines.length-1,cy+n),x:cx};
  if(key==='k')return{y:Math.max(0,cy-n),x:cx};
  if(key==='0')return{y:cy,x:0};
  if(key==='^')return{y:cy,x:firstNB(lines[cy])};
  if(key==='$')return{y:cy,x:Math.max(0,lines[cy].length-1)};
  for(let i=0;i<n;i++){
    if(key==='w')wFwd();else if(key==='b')wBack();else if(key==='e')wEnd();
  }
  const r={y:cy,x:cx};cy=sy;cx=sx;return r;
}

// ---------- диапазоны ----------
function extract(sl,sc,el,ec){
  if(sl===el)return lines[sl].slice(sc,ec);
  const p=[lines[sl].slice(sc)];
  for(let i=sl+1;i<el;i++)p.push(lines[i]);
  p.push(lines[el].slice(0,ec));
  return p.join('\n');
}
function delRange(sl,sc,el,ec){
  if(sl===el){lines[sl]=lines[sl].slice(0,sc)+lines[sl].slice(ec);return;}
  lines[sl]=lines[sl].slice(0,sc)+lines[el].slice(ec);
  lines.splice(sl+1,el-sl);
}

// ---------- операторы ----------
function lineOp(op,n){
  const s=cy,e=Math.min(lines.length-1,cy+n-1),cnt=e-s+1;
  const t=lines.slice(s,e+1).join('\n');
  if(op==='y'){reg=t;regLine=true;setMsg(cnt+' строк');return;}
  save();reg=t;regLine=true;
  if(op==='c'){const b=[];for(let i=0;i<cnt;i++)b.push('');
    lines.splice(s,cnt,...b);cy=s;cx=0;mode='insert';}
  else{lines.splice(s,cnt);if(!lines.length)lines=[''];
    cy=Math.min(s,lines.length-1);cx=Math.min(cx,Math.max(0,lines[cy].length-1));}
}
function motionOp(op,k,n){
  let t=motion(k,n);if(!t)return;
  if((k==='w'||k==='e')&&t.y!==cy)t={y:cy,x:lines[cy].length};
  let sl=cy,sc=cx,el=t.y,ec=t.x;
  if(k==='e')ec++;
  if(el<sl||(el===sl&&ec<sc)){[sl,el]=[el,sl];[sc,ec]=[ec,sc];}
  if(sl===el&&sc===ec)return;
  reg=extract(sl,sc,el,ec);regLine=sl!==el;
  if(op==='y'){setMsg('скопировано');return;}
  save();
  delRange(sl,sc,el,ec);
  if(op==='c'){cy=sl;cx=sc;mode='insert';}
  else{cy=sl;cx=Math.min(sc,Math.max(0,lines[cy].length-1));}
}

// ---------- вставка ----------
function insText(t){lines[cy]=lines[cy].slice(0,cx)+t+lines[cy].slice(cx);cx+=t.length;dirty=true;}
function insNL(){const L=lines[cy],b=L.slice(0,cx),a=L.slice(cx);
  lines[cy]=b;lines.splice(cy+1,0,a);cy++;cx=0;dirty=true;}
function bs(){if(cx>0){lines[cy]=lines[cy].slice(0,cx-1)+lines[cy].slice(cx);cx--;}
  else if(cy>0){const p=lines[cy-1].length;lines[cy-1]+=lines[cy];lines.splice(cy,1);cy--;cx=p;}
  dirty=true;}
function delFwd(){const L=lines[cy];
  if(cx<L.length)lines[cy]=L.slice(0,cx)+L.slice(cx+1);
  else if(cy<lines.length-1){lines[cy]+=lines[cy+1];lines.splice(cy+1,1);}
  dirty=true;}
function pasteAfter(n){if(!reg)return setMsg('пусто');save();
  if(regLine){const p=reg.split('\n');let a=[];
    for(let i=0;i<n;i++)a=a.concat(p);
    lines.splice(cy+1,0,...a);cy++;cx=firstNB(lines[cy]);}
  else{const L=lines[cy],col=Math.min(cx+1,L.length),t=reg.repeat(n);
    lines[cy]=L.slice(0,col)+t+L.slice(col);cx=col+t.length-1;}}
function pasteBefore(n){if(!reg)return setMsg('пусто');save();
  if(regLine){const p=reg.split('\n');let a=[];
    for(let i=0;i<n;i++)a=a.concat(p);
    lines.splice(cy,0,...a);cx=firstNB(lines[cy]);}
  else{const L=lines[cy],col=cx,t=reg.repeat(n);
    lines[cy]=L.slice(0,col)+t+L.slice(col);cx=col+t.length-1;}}

// ---------- visual ----------
function selRange(){
  if(!anchor)return null;
  let al=anchor.l,ac=anchor.c,bl=cy,bc=cx;
  if(al>bl||(al===bl&&ac>bc)){[al,bl]=[bl,al];[ac,bc]=[bc,ac];}
  return{sl:al,sc:ac,el:bl,ec:bc};
}
function visDel(op){
  const s=selRange();if(!s){mode='normal';anchor=null;return;}
  if(mode==='vline'){
    reg=lines.slice(s.sl,s.el+1).join('\n');regLine=true;
    save();
    if(op==='c'){const n=s.el-s.sl+1,b=[];
      for(let i=0;i<n;i++)b.push('');
      lines.splice(s.sl,n,...b);cy=s.sl;cx=0;mode='insert';}
    else{lines.splice(s.sl,s.el-s.sl+1);
      if(!lines.length)lines=[''];
      cy=Math.min(s.sl,lines.length-1);cx=0;mode='normal';}
  }else{
    reg=extract(s.sl,s.sc,s.el,s.ec+1);regLine=false;
    save();delRange(s.sl,s.sc,s.el,s.ec+1);
    if(op==='c'){cy=s.sl;cx=s.sc;mode='insert';}
    else{cy=s.sl;cx=Math.min(s.sc,Math.max(0,lines[cy].length-1));mode='normal';}
  }
  anchor=null;
}
function visYank(){
  const s=selRange();if(!s){mode='normal';anchor=null;return;}
  if(mode==='vline'){reg=lines.slice(s.sl,s.el+1).join('\n');regLine=true;
    setMsg((s.el-s.sl+1)+' строк');}
  else{reg=extract(s.sl,s.sc,s.el,s.ec+1);regLine=false;setMsg('скопировано');}
  cy=s.sl;cx=s.sc;mode='normal';anchor=null;
}
function indent(out){
  const s=selRange();if(!s)return;save();
  for(let i=s.sl;i<=s.el;i++){
    if(out){const m=lines[i].match(/^ {1,4}/);if(m)lines[i]=lines[i].slice(m[0].length);}
    else lines[i]='    '+lines[i];
  }
  cy=s.sl;cx=firstNB(lines[cy]);mode='normal';anchor=null;
}

// ---------- режимы ----------
function escapeMode(){
  pendingCount='';pendingOp='';pendingG=false;
  if(mode==='command'){cmdBuf='';mode='normal';}
  else if(mode==='insert'){mode='normal';
    const m=Math.max(0,lines[cy].length-1);if(cx>m)cx=m;}
  else if(mode==='visual'||mode==='vline'){mode='normal';anchor=null;}
  render();
}
function handleInsert(e){
  if(e.ctrlKey||e.altKey||e.metaKey)return;
  const k=e.key;
  if(k==='Enter')insNL();
  else if(k==='Backspace')bs();
  else if(k==='Delete')delFwd();
  else if(k==='Tab')insText('    ');
  else if(k==='ArrowLeft'){if(cx>0)cx--;else if(cy>0){cy--;cx=lines[cy].length;}}
  else if(k==='ArrowRight'){if(cx<lines[cy].length)cx++;else if(cy<lines.length-1){cy++;cx=0;}}
  else if(k==='ArrowUp'){if(cy>0){cy--;cx=Math.min(cx,lines[cy].length);}}
  else if(k==='ArrowDown'){if(cy<lines.length-1){cy++;cx=Math.min(cx,lines[cy].length);}}
  else if(k==='Home')cx=0;
  else if(k==='End')cx=lines[cy].length;
  else if(k.length===1)insText(k);
  render();
}
function handleCmd(e){
  const k=e.key;
  if(k==='Enter'){const c=cmdBuf;cmdBuf='';execCmd(c);return;}
  if(k==='Backspace'){if(cmdBuf.length)cmdBuf=cmdBuf.slice(0,-1);else mode='normal';render();return;}
  if(k.length===1&&!e.ctrlKey&&!e.metaKey){cmdBuf+=k;render();}
}
function handleVisual(e){
  if(e.ctrlKey||e.altKey||e.metaKey)return;
  const k=e.key;
  if(/^[1-9]$/.test(k)){pendingCount+=k;return;}
  if(k==='0'&&pendingCount){pendingCount+=k;return;}
  const n=pendingCount?parseInt(pendingCount,10):1;pendingCount='';
  switch(k){
    case 'h':cx=Math.max(0,cx-n);break;
    case 'l':cx=Math.min(Math.max(0,lines[cy].length-1),cx+n);break;
    case 'j':cy=Math.min(lines.length-1,cy+n);cx=Math.min(cx,Math.max(0,lines[cy].length-1));break;
    case 'k':cy=Math.max(0,cy-n);cx=Math.min(cx,Math.max(0,lines[cy].length-1));break;
    case '0':cx=0;break;
    case '^':cx=firstNB(lines[cy]);break;
    case '$':cx=Math.max(0,lines[cy].length-1);break;
    case 'w':for(let i=0;i<n;i++)wFwd();break;
    case 'b':for(let i=0;i<n;i++)wBack();break;
    case 'e':for(let i=0;i<n;i++)wEnd();break;
    case 'G':cy=lines.length-1;cx=Math.max(0,lines[cy].length-1);break;
    case 'd':case 'x':visDel('d');break;
    case 'y':visYank();break;
    case 'c':visDel('c');break;
    case '>':indent(false);break;
    case '<':indent(true);break;
    case 'v':mode='normal';anchor=null;break;
    case 'V':mode=mode==='vline'?'visual':'vline';break;
  }
  render();
}
function handleNormal(e){
  if(e.metaKey)return;
  if(e.ctrlKey){if(e.key==='r'||e.key==='R'){e.preventDefault();redo();render();}return;}
  if(e.altKey)return;
  const k=e.key;
  if(/^[1-9]$/.test(k)&&!pendingG){pendingCount+=k;return;}
  if(k==='0'&&pendingCount){pendingCount+=k;return;}
  const n=pendingCount?parseInt(pendingCount,10):1;

  if(pendingOp){
    if(k===pendingOp){lineOp(pendingOp,n);pendingOp='';pendingCount='';render();return;}
    if(['h','j','k','l','w','b','e','0','$','^','G'].includes(k)){
      motionOp(pendingOp,k,n);pendingOp='';pendingCount='';render();return;}
    pendingOp='';pendingCount='';render();return;
  }
  if(pendingG){
    pendingG=false;
    if(k==='g'){cy=pendingCount?Math.max(0,Math.min(lines.length-1,parseInt(pendingCount,10)-1)):0;cx=0;}
    pendingCount='';render();return;
  }
  switch(k){
    case 'h':cx=Math.max(0,cx-n);break;
    case 'l':cx=Math.min(Math.max(0,lines[cy].length-1),cx+n);break;
    case 'j':for(let i=0;i<n;i++)if(cy<lines.length-1)cy++;
      cx=Math.min(cx,Math.max(0,lines[cy].length-1));break;
    case 'k':for(let i=0;i<n;i++)if(cy>0)cy--;
      cx=Math.min(cx,Math.max(0,lines[cy].length-1));break;
    case '0':cx=0;break;
    case '^':cx=firstNB(lines[cy]);break;
    case '$':cx=Math.max(0,lines[cy].length-1);break;
    case 'w':for(let i=0;i<n;i++)wFwd();break;
    case 'b':for(let i=0;i<n;i++)wBack();break;
    case 'e':for(let i=0;i<n;i++)wEnd();break;
    case 'G':cy=pendingCount?Math.max(0,Math.min(lines.length-1,parseInt(pendingCount,10)-1)):lines.length-1;
      cx=firstNB(lines[cy]);break;
    case 'g':pendingG=true;break;
    case 'i':save();mode='insert';break;
    case 'a':save();if(lines[cy].length>0)cx=Math.min(cx+1,lines[cy].length);mode='insert';break;
    case 'I':save();cx=firstNB(lines[cy]);mode='insert';break;
    case 'A':save();cx=lines[cy].length;mode='insert';break;
    case 'o':save();lines.splice(cy+1,0,'');cy++;cx=0;mode='insert';break;
    case 'O':save();lines.splice(cy,0,'');cx=0;mode='insert';break;
    case 'x':save();{const L=lines[cy];
      if(L.length){reg=L[cx];regLine=false;
        lines[cy]=L.slice(0,cx)+L.slice(cx+1);
        cx=Math.min(cx,Math.max(0,lines[cy].length-1));}}break;
    case 'X':save();if(cx>0){reg=lines[cy][cx-1];regLine=false;
      lines[cy]=lines[cy].slice(0,cx-1)+lines[cy].slice(cx);cx--;}break;
    case 'd':pendingOp='d';break;
    case 'y':pendingOp='y';break;
    case 'c':pendingOp='c';break;
    case 'p':pasteAfter(n);break;
    case 'P':pasteBefore(n);break;
    case 'u':undo();break;
    case 'r':setMsg('символ для замены');pendingOp='r';render();return;
    case 'v':mode='visual';anchor={l:cy,c:cx};break;
    case 'V':mode='vline';anchor={l:cy,c:cx};break;
    case ':':mode='command';cmdBuf='';break;
    case 'D':save();reg=lines[cy].slice(cx);regLine=false;
      lines[cy]=lines[cy].slice(0,cx);cx=Math.max(0,lines[cy].length-1);break;
    case 'C':save();reg=lines[cy].slice(cx);regLine=false;
      lines[cy]=lines[cy].slice(0,cx);mode='insert';break;
    case 'S':save();reg=lines[cy];regLine=true;lines[cy]='';cx=0;mode='insert';break;
    case 'J':if(cy<lines.length-1){save();
      lines[cy]=lines[cy]+' '+lines[cy+1].replace(/^\s+/,'');
      lines.splice(cy+1,1);}break;
    case '~':save();{const L=lines[cy];
      if(L.length){const c=L[cx],s=c===c.toLowerCase()?c.toUpperCase():c.toLowerCase();
        lines[cy]=L.slice(0,cx)+s+L.slice(cx+1);
        cx=Math.min(cx+1,Math.max(0,lines[cy].length-1));}}break;
  }
  if(!pendingOp)pendingCount='';
  render();
}

// ---------- главный keydown ----------
function onKey(e){
  if(e.metaKey)return;
  if(e.key==='Escape'){e.preventDefault();escapeMode();return;}
  if(pendingOp==='r'&&mode==='normal'){
    if(e.key.length===1){
      e.preventDefault();save();
      const L=lines[cy];
      if(L.length)lines[cy]=L.slice(0,cx)+e.key+L.slice(cx+1);
      pendingOp='';render();return;
    }
    pendingOp='';
  }
  if(mode==='command'){e.preventDefault();handleCmd(e);return;}
  if(mode==='insert'){e.preventDefault();handleInsert(e);return;}
  if(mode==='visual'||mode==='vline'){e.preventDefault();handleVisual(e);return;}
  if(e.ctrlKey&&(e.key==='r'||e.key==='R')){e.preventDefault();redo();render();return;}
  if(!e.ctrlKey&&!e.altKey){
    if(e.key.length===1||['Backspace','Enter','Tab','Home','End','Delete'].includes(e.key))
      e.preventDefault();
  }
  handleNormal(e);
}

// ---------- команды ----------
function saveFile(){
  try{localStorage.setItem('vimjs:'+filename,lines.join('\n'));
    localStorage.setItem('vimjs:last',filename);dirty=false;}catch(_){}
}
function loadFile(name){
  let d=null;
  try{d=localStorage.getItem('vimjs:'+name);}catch(_){}
  if(d!==null){lines=d.split('\n');setMsg('"'+name+'" загружен');}
  else{lines=[''];setMsg('"'+name+'" новый');}
  filename=name;cy=0;cx=0;undoS=[];redoS=[];dirty=false;
  try{localStorage.setItem('vimjs:last',name);}catch(_){}
}
function execCmd(cmd){
  mode='normal';cmd=cmd.trim();
  if(!cmd){render();return;}
  if(cmd==='help'||cmd==='h'){help=!help;render();return;}
  if(cmd==='w'||cmd==='write'){saveFile();setMsg('"'+filename+'" записан');}
  else if(cmd.startsWith('w ')){filename=cmd.slice(2).trim();saveFile();
    setMsg('"'+filename+'" записан');}
  else if(cmd==='q'||cmd==='quit'){
    if(dirty)setMsg('есть изменения — :q! для выхода');else setMsg('закройте вкладку');}
  else if(cmd==='q!')setMsg('закройте вкладку');
  else if(cmd==='wq'||cmd==='x'){saveFile();setMsg('"'+filename+'" записан');}
  else if(cmd==='e'||cmd==='e!')loadFile(filename);
  else if(cmd.startsWith('e '))loadFile(cmd.slice(2).trim());
  else if(/^\d+$/.test(cmd)){cy=Math.max(0,Math.min(lines.length-1,parseInt(cmd,10)-1));
    cx=firstNB(lines[cy]);}
  else if(cmd==='$'){cy=lines.length-1;cx=firstNB(lines[cy]);}
  else setMsg('неизвестно: '+cmd);
  render();
}

// ---------- клик ----------
codeEl.addEventListener('mousedown',e=>{
  e.preventDefault();
  let r=null;
  if(document.caretRangeFromPoint)r=document.caretRangeFromPoint(e.clientX,e.clientY);
  else if(document.caretPositionFromPoint){const p=document.caretPositionFromPoint(e.clientX,e.clientY);
    if(p){r=document.createRange();r.setStart(p.offsetNode,p.offset);r.collapse(true);}}
  if(!r)return;
  const node=r.startContainer;
  const lineEl=node.nodeType===1?(node.closest?node.closest('.line'):null)
    :(node.parentElement?node.parentElement.closest('.line'):null);
  if(!lineEl)return;
  const li=parseInt(lineEl.getAttribute('data-line'),10);
  if(isNaN(li))return;
  let col=0;
  if(node===lineEl){for(let i=0;i<r.startOffset&&i<lineEl.childNodes.length;i++)
    col+=lineEl.childNodes[i].textContent.length;}
  else{const w=document.createTreeWalker(lineEl,NodeFilter.SHOW_TEXT,null);let n;
    while((n=w.nextNode())){if(n===node){col+=r.startOffset;break;}col+=n.textContent.length;}}
  cy=li;
  cx=mode==='insert'?Math.min(col,lines[cy].length):Math.min(col,Math.max(0,lines[cy].length-1));
  render();
});

// ---------- старт ----------
(function init(){
  let restored=false;
  try{const last=localStorage.getItem('vimjs:last');
    if(last){const d=localStorage.getItem('vimjs:'+last);
      if(d!==null){filename=last;lines=d.split('\n');restored=true;}}}catch(_){}
  if(!restored){
    lines=['// vim.js — мини-Vim в браузере','//',
      '// Нажмите  i  для вставки,  Esc  для выхода,',
      '// :help — справка,  :wq — сохранить.','',
      'function hello(name) {',
      '    console.log("Привет, " + name + "!");',
      '}','','hello("мир");',''];
    filename='welcome.js';
  }
  cy=0;cx=0;render();
  document.addEventListener('keydown',onKey);
  setTimeout(()=>setMsg('готово — :help для справки'),400);
})();
})();
</script>
